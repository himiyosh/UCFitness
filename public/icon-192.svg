<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6366f1"/>
            <stop offset="50%" style="stop-color:#8b5cf6"/>
            <stop offset="100%" style="stop-color:#a855f7"/>
        </linearGradient>
        <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
            <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <!-- 背景（角丸） -->
    <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
    <!-- 光沢オーバーレイ -->
    <rect width="512" height="512" rx="112" ry="112" fill="url(#shine)"/>
    <!-- アクセント円 -->
    <circle cx="256" cy="248" r="180" fill="rgba(255,255,255,0.06)"/>
    <!-- ボルトのグロー（影） -->
    <polygon points="290,60 178,258 254,258 192,452 334,238 258,238" fill="rgba(255,255,255,0.12)" filter="url(#glow)"/>
    <!-- ⚡ 稲妻ボルト -->
    <polygon points="290,60 178,258 254,258 192,452 334,238 258,238" fill="white"/>
</svg>
