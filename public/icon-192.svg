<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFE66D"/>
            <stop offset="25%" style="stop-color:#95E500"/>
            <stop offset="50%" style="stop-color:#4ECDC4"/>
            <stop offset="75%" style="stop-color:#4F46E5"/>
            <stop offset="100%" style="stop-color:#FF85A2"/>
        </linearGradient>
    </defs>
    <!-- 回転グループ -->
    <g transform="rotate(12 256 256)">
        <!-- レインボーボーダー -->
        <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="url(#rainbow)"/>
        <!-- Indigo 内側 -->
        <rect x="48" y="48" width="416" height="416" rx="80" ry="80" fill="#4F46E5"/>
        <!-- ⚡ 稲妻ボルト（ストローク） -->
        <path d="M277 107L170 277h64l-53 128 121-160h-64z" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg>
