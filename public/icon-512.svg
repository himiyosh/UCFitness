<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- 背景（角丸） -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- 光沢オーバーレイ -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#shine)"/>
  <!-- アクセント円 -->
  <circle cx="256" cy="256" r="190" fill="rgba(255,255,255,0.07)"/>
  <!-- UC テキスト -->
  <text x="256" y="270" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="210" fill="white" letter-spacing="-8">UC</text>
  <!-- FIT テキスト -->
  <text x="265" y="360" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="88" fill="rgba(255,255,255,0.85)" letter-spacing="16">FIT</text>
  <!-- ボトムアクセントライン -->
  <rect x="156" y="390" width="200" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
</svg>
