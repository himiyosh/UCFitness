<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="glassClip">
      <rect x="92" y="92" width="328" height="164" rx="67"/>
    </clipPath>
  </defs>
  <!-- 外枠: グリーン→シアングラデーション -->
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>
  <!-- 内側: インディゴグラデーション -->
  <rect x="92" y="92" width="328" height="328" rx="67" fill="url(#inner)"/>
  <!-- ガラス反射 -->
  <rect x="92" y="92" width="328" height="164" rx="67" fill="url(#glass)" clip-path="url(#glassClip)"/>
  <!-- 稲妻アイコン -->
  <svg x="177" y="177" width="159" height="159" viewBox="0 0 24 24">
    <path d="M13.5 2.5L7 13h4.5L9 21.5l8.5-11h-4.5z" fill="white" stroke="white" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
</svg>