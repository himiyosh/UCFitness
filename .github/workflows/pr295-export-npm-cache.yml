name: PR 295 npm cache export

on:
  push:
    branches:
      - himiyosh-miniature-train

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache macOS runtime packages
        run: |
          npm cache add @next/swc-darwin-arm64@15.5.21 --registry=https://registry.npmjs.org/
          npm cache add @img/sharp-darwin-arm64@0.35.3 --registry=https://registry.npmjs.org/
          npm cache add @img/sharp-libvips-darwin-arm64@1.3.2 --registry=https://registry.npmjs.org/

      - name: Upload npm cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-cache-pr295-${{ github.sha }}
          path: ~/.npm/_cacache
          compression-level: 0
          retention-days: 1
