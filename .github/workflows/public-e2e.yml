name: Public E2E

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright public routes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run public E2E tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: ${{ failure() && hashFiles('test-results/**/test-failed-*.png', 'test-results/**/trace.zip') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3
