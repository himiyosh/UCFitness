name: Public E2E

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright public routes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run public E2E tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: ${{ failure() && hashFiles('test-results/**/test-failed-*.png', 'test-results/**/trace.zip') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3
