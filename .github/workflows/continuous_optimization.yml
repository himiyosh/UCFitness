# =============================================================================
# 自律的コード改善ループ (Autonomous Code Improvement Loop)
# =============================================================================
# トリガー: main ブランチへの push
# 安全策: [bot] AI-Improvement で始まるコミットはスキップ
# 3つの専門エージェント (UI/UX, Performance, Security) が
# Generator ↔ Reviewer パターンでコードを改善する
# =============================================================================

name: "🤖 Continuous Code Optimization"

# ---------------------------------------------------------------------------
# トリガー設定 (日常ループはローカルスクリプトで実行、Actions は手動のみ)
# ---------------------------------------------------------------------------
on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            target_agent:
                description: "実行するエージェント (all / uiux / performance / security)"
                required: false
                default: "all"
                type: choice
                options:
                    - all
                    - uiux
                    - performance
                    - security
            max_cycles:
                description: "マルチサイクル回数 (改善がなくなるまで最大N回繰り返す)"
                required: false
                default: "5"
                type: choice
                options:
                    - "1"
                    - "3"
                    - "5"
                    - "10"
            dry_run:
                description: "ドライラン (コミットせずにレポートのみ出力)"
                required: false
                default: false
                type: boolean

# ---------------------------------------------------------------------------
# 権限設定
# ---------------------------------------------------------------------------
permissions:
    contents: write # コードの読み書き（コミット＆プッシュ用）
    pull-requests: write # PR 作成用（将来拡張）
    actions: read # ワークフロー読み取り

# ---------------------------------------------------------------------------
# 同時実行制御（同時に複数のボット改善を防止）
# ---------------------------------------------------------------------------
concurrency:
    group: ai-improvement-${{ github.ref }}
    cancel-in-progress: true

# ---------------------------------------------------------------------------
# ジョブ定義
# ---------------------------------------------------------------------------
jobs:
    optimize:
        name: "🔄 AI Code Improvement Loop"
        runs-on: ubuntu-latest
        timeout-minutes: 30

        # -----------------------------------------------------------------------
        # 無限ループ防止: push トリガー時のみボットコミットをスキップ
        # -----------------------------------------------------------------------
        if: >-
            github.event_name == 'workflow_dispatch' ||
            !startsWith(github.event.head_commit.message, '[bot] AI-Improvement')

        steps:
            # =====================================================================
            # 1. リポジトリのチェックアウト
            # =====================================================================
            - name: "📥 Checkout repository"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # 全履歴取得（ブランチ操作のため）
                  token: ${{ secrets.GITHUB_TOKEN }}

            # =====================================================================
            # 2. Git ユーザー設定（ボットとしてコミットするため）
            # =====================================================================
            - name: "🔧 Configure Git user"
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            # =====================================================================
            # 3. Node.js セットアップ（Next.js プロジェクトのテスト用）
            # =====================================================================
            - name: "📦 Setup Node.js"
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: "📦 Install Node.js dependencies"
              run: npm ci

            # =====================================================================
            # 4. Python セットアップ
            # =====================================================================
            - name: "🐍 Setup Python"
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: scripts/requirements-agent.txt

            - name: "📦 Install Python dependencies"
              run: |
                  python -m pip install --upgrade pip
                  pip install -r scripts/requirements-agent.txt

            # =====================================================================
            # 5. GitHub CLI Copilot 拡張のセットアップ
            # =====================================================================
            - name: "🤖 Setup GitHub Copilot CLI"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh extension install github/gh-copilot || true
                  echo "GitHub Copilot CLI extension installed"

            # =====================================================================
            # 6. 変更ファイルの事前チェック
            # =====================================================================
            - name: "🔍 Check changed files"
              id: changed
              run: |
                  CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(ts|tsx|js|jsx|py|css|scss)$' | head -20)
                  if [ -z "$CHANGED" ]; then
                    echo "has_targets=false" >> "$GITHUB_OUTPUT"
                    echo "対象ファイルなし — スキップします"
                  else
                    echo "has_targets=true" >> "$GITHUB_OUTPUT"
                    echo "対象ファイル:"
                    echo "$CHANGED"
                  fi

            # =====================================================================
            # 7. エージェントループ実行
            # =====================================================================
            - name: "🤖 Run Agent Improvement Loop"
              if: steps.changed.outputs.has_targets == 'true' || github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_WORKSPACE: ${{ github.workspace }}
                  AGENT_TARGET: ${{ github.event.inputs.target_agent || 'all' }}
                  MAX_CYCLES: ${{ github.event.inputs.max_cycles || '5' }}
                  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
                  TRIGGER_EVENT: ${{ github.event_name }}
              run: |
                  python scripts/agent_loop.py

            # =====================================================================
            # 8. レポートのアップロード
            # =====================================================================
            - name: "📊 Upload improvement report"
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: improvement-report
                  path: improvement-report.json
                  retention-days: 30
                  if-no-files-found: ignore
